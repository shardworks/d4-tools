# docker-compose.e2e.yml — one-command e2e bring-up
#
# Starts a single service (e2e) that:
#   - Installs pnpm dependencies
#   - Runs Playwright UI mode bound to 0.0.0.0 so it is reachable from any
#     machine on the same LAN
#
# Each spec file starts its own next dev instance on an OS-assigned free port,
# bound to 0.0.0.0 (see e2e/fixtures/server.ts).  In remote-monitor mode the
# developer watches test execution through the Playwright UI; DOM snapshots,
# screenshots, and traces are all visible there without needing direct access to
# a specific per-spec port.
#
# Default ports:
#   Playwright UI: E2E_UI_PORT=9323
#   HTML report:   E2E_REPORT_PORT=9324
#
# One-command bring-up: pnpm e2e:ui
# Remote access: http://<host>:9323 for Playwright UI
#
# After a run inside the container, serve the HTML report:
#   docker compose -f docker-compose.e2e.yml exec e2e \
#     playwright show-report --host 0.0.0.0 --port ${E2E_REPORT_PORT:-9324}

version: "3.8"

services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
      args:
        PLAYWRIGHT_VERSION: "1.59.1"
    image: d4-tools-e2e:1.59.1
    # Bind-mount the workspace (D12)
    volumes:
      - .:/workspace:cached
      # Separate volume for pnpm store to persist across container restarts
      - pnpm-store:/root/.local/share/pnpm
      # Separate volume for .next build cache
      - next-cache:/workspace/.next
    working_dir: /workspace
    environment:
      # App environment variables (D17)
      DATA_DIR: /tmp/e2e-data
      SCREENSHOT_DIR: /tmp/e2e-screenshots
      ANTHROPIC_API_KEY: test-key-not-real
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: development

      # Port configuration
      E2E_UI_PORT: "${E2E_UI_PORT:-9323}"
      E2E_REPORT_PORT: "${E2E_REPORT_PORT:-9324}"
      PLAYWRIGHT_WORKERS: "${PLAYWRIGHT_WORKERS:-2}"

      # Force e2e temp dirs into workspace tmp/ so tsconfig exclude covers them
      E2E_TMPDIR: /workspace/tmp/e2e

      # Playwright manages server lifecycle per-spec; no global webServer needed
      PLAYWRIGHT_NO_WEBSERVER: "1"

    # Publish Playwright UI and report ports to the LAN.
    # Per-spec next dev servers use OS-assigned ephemeral ports; they are
    # reachable from outside the container (bound to 0.0.0.0) but there is
    # no fixed port to publish here — use Playwright UI traces to inspect them.
    ports:
      - "${E2E_UI_PORT:-9323}:9323"
      - "${E2E_REPORT_PORT:-9324}:9324"

    # Install dependencies and start Playwright UI
    command: >
      sh -c "
        pnpm install &&
        pnpm exec playwright install chromium &&
        pnpm exec playwright test --ui --ui-host=0.0.0.0 --ui-port=${E2E_UI_PORT:-9323}
      "

    # Give next dev enough memory for HMR
    shm_size: "256mb"

volumes:
  pnpm-store:
  next-cache:
